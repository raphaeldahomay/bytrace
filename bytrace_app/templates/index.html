<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bytrace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="navbar">
        <a href="/" onclick="trackClick(event, 'logo_click', 'logo', '/')" class="logo">BYTRACE</a>

        <nav>
            <a href="/" onclick="trackClick(event, 'navigation_click', 'home', '/')">Home</a>
            <a href="/about" onclick="trackClick(event, 'navigation_click', 'about', '/about')">About</a>
            <a href="/engine" onclick="trackClick(event, 'navigation_click', 'engine', '/engine')">Engine</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="hero-logo">B1</h1>

        <section class="converter-box">
            <form method="POST" action="/">
                <select name="converter_type" class="select-box" required>
                    <option value="">Choose your converter</option>
                    <option value="text_to_binary">Text → Binary</option>
                    <option value="binary_to_text">Binary → Text</option>

                    <option value="text_to_ascii">Text → ASCII</option>
                    <option value="ascii_to_text">ASCII → Text</option>

                    <option value="ascii_to_binary">ASCII → Binary</option>
                    <option value="binary_to_ascii">Binary → ASCII</option>
                </select>

                <div class="arrow">↓</div>

                <label for="user-input">Enter your input:</label>

                <div class="input-row">
                    <input type="text" id="user-input" name="user_input" required>
                    <button type="submit">CONVERT</button>
                </div>
            </form>

            {% if output %}
                <div class="arrow">↓</div>

                <div class="output-label">Here’s your output:</div>
                <p class="output">{{ output }}</p>
            {% endif %}
        </section>
    </main>

    <footer>
        Bytrace all rights reserved 2026 ©
    </footer>

    <script src="{{ url_for('static', filename='js/tracking.js') }}"></script>
</body>
</html>
